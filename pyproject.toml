[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synaptrix"
version = "1.0.0"
dependencies = [
  "matplotlib==3.10.0",
  "numpy~=2.2",
  "pandas==2.2.3",
  "pylsl==1.17.6",
  "requests==2.32.3",
  "seaborn==0.13.2",
]
authors = [
  { name = "Eric Yao", email = "eric@synaptrix-labs.com" },
  { name = "Mofei Wang", email = "mofei.mw@gmail.com" }
]
description = "Library for live and offline denoising of multi-channel EEG data powered by auto-encoders, created by Synaptrix Labs Inc."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/Synaptrix-Labs/Synaptrix"
